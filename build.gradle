plugins {
	id 'fabric-loom' version '1.14-SNAPSHOT'
}

// One codebase, several Minecraft versions. Pick one with -Pminecraft_version=1.21.4 (the default
// is set in gradle.properties). The mappings and Meteor build for it come from
// versions/<version>.properties. Code that differs between versions is written in //#if blocks,
// see gradle/versioned.gradle.
def mcVersion = project.minecraft_version
def versionFile = file("versions/${mcVersion}.properties")
if (!versionFile.exists()) {
	def known = file('versions').listFiles().findAll { it.name.endsWith('.properties') }.collect { it.name - '.properties' }.sort()
	throw new GradleException("Minecraft ${mcVersion} is not supported. Pick one of: ${known.join(', ')}")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.set(k, v) }

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

apply from: 'gradle/versioned.gradle'

repositories {
	mavenCentral()
	maven {
		name = 'meteor-maven'
		url = 'https://maven.meteordev.org/releases'
	}
	maven {
		name = 'meteor-maven-snapshots'
		url = 'https://maven.meteordev.org/snapshots'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Meteor 1.21.11 is still on Yarn, so this addon has to be too.
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

	// MP3 decoding for Chat Notifier (LGPL-2.1). Bundled inside the JJ's Tools jar.
	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', mcVersion
	filesMatching('fabric.mod.json') {
		expand 'version': project.version, 'minecraft_version': mcVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ["-Xmaxerrs", "100000"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.archives_base_name}" }
	}
}

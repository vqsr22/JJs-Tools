org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The Minecraft version to build for. Override with -Pminecraft_version=1.21.4 and so on.
# Its mappings and Meteor build are in versions/<version>.properties: keep those in sync
# with Meteor's own branch for that version, as an addon has to be built against the same
# mappings as the client it plugs into.
minecraft_version=1.21.11
loader_version=0.18.2

mod_version = 0.5.3
maven_group=dev.jjstools
archives_base_name=jjs-tools
